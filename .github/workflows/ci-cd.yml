name: CI/CD

# Every push and pull request runs the unit tests and checks that the Docker image builds.
# A push to main that passes both moves the `deploy` branch to that commit; Streamlit Community
# Cloud watches `deploy` and publishes it. A failing commit never goes live.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests (offline, no secrets needed)
        run: pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --tag frostline:ci .
      - name: Image contains no secrets or data
        run: |
          docker run --rm --entrypoint sh frostline:ci -c 'test ! -e .env && test ! -e data && test "$(id -u)" = 1000'

  deploy:
    name: Release to Streamlit Cloud
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    environment:
      name: production
      url: https://frostline-ai.streamlit.app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move the deploy branch to this tested commit
        run: |
          git push --force origin "HEAD:refs/heads/deploy"
          echo "Released ${GITHUB_SHA::7} to the deploy branch" >> "$GITHUB_STEP_SUMMARY"
